<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Fulfillment Linehaul</title>

    <link rel="stylesheet" href="style.css">

</head>

<div id="modalConfirmacao" class="modal">

    <div class="modal-content">

        <h3>Confirmar etapa</h3>

        <p id="textoConfirmacao"></p>

        <div class="modal-botoes">

            <button
                class="btn-cancelar"
                onclick="fecharModal()">
                Cancelar
            </button>

            <button
                class="btn-confirmar"
                onclick="confirmarEtapa()">
                Confirmar
            </button>

        </div>

    </div>

</div> 


<body>

    <div class="container">

        <div class="header">

            <img src="logo.png" alt="logo" class="logo">   
            <h1>Fulfillment Linehaul</h1>

        </div>

        <div id="chat"></div>

        <div class="input-area">

            <input
                id="userInput"
                type="text"
                placeholder="Digite aqui">

            <button onclick="sendMessage()">
                Enviar
            </button>

        </div>

        <button
            id="btnEtapa"
            onclick="abrirModal()">

            INÍCIO CARREGAMENTO

        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
